name: Node.js CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  lints:
    name: Check lints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v2
      - name: Use Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: '^18.17.0'
      - run: yarn install --frozen-lockfile
      - name: ESLint & Prettier
        run: yarn lint

  types:
    name: Check types
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v2
      - name: Use Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: '^18.17.0'
      - run: yarn install --frozen-lockfile
      - name: TypeScript
        run: yarn type-check
