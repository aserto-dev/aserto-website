name: Push main branch to other environments


on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  VAULT_ADDR: https://vault.aserto.com/

jobs:
  push_branch:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        target_branch: [
          eng,
          preproduction
        ]

    steps:
      - name: Read Configuration
        uses: hashicorp/vault-action@v2.4.1
        id: vault
        with:
          url: ${{ env.VAULT_ADDR }}
          token: ${{ secrets.VAULT_TOKEN }}
          secrets: |
            kv/data/github  "SSH_PRIVATE_KEY"     | SSH_PRIVATE_KEY;
            kv/data/github  "READ_WRITE_TOKEN"    | READ_WRITE_TOKEN;
            kv/data/github  "SLACK_BOT_TOKEN"     | SLACK_BOT_TOKEN;

      - name: Setup git
        run: |
          mkdir -p $HOME/.ssh
          umask 0077 && echo -e "${SSH_PRIVATE_KEY}" > $HOME/.ssh/id_rsa
          ssh-keyscan github.com >> $HOME/.ssh/known_hosts
          git config --global url."git@github.com:".insteadOf https://github.com/
          git config --global user.email "github-bot@aserto.com"
          git config --global user.name "Aserto Bot"

      - name: Checkout repo
        if: ${{ success() }}
        uses: actions/checkout@v2
        with:
          # Fetch all commit history. The default only downloads 1 commit which means Git won't be able to
          # correctly detect when a branch in an ancestor of another branch when it's more than one commit behind.
          fetch-depth: 0
          # Need to use a PAT in order for the push performed by this workflow to trigger other workflows
          # https://docs.github.com/en/actions/reference/events-that-trigger-workflows#triggering-new-workflows-using-a-personal-access-token
          token: ${{ steps.vault.outputs.READ_WRITE_TOKEN }}

      - name: Get revision hashes
        if: ${{ success() }}
        run: |
          git fetch origin
          git fetch origin ${{ matrix.target_branch }}
          echo "PREVIOUS_COMMIT_HASH=$(git rev-parse --short origin/${{ matrix.target_branch }})" >> $GITHUB_ENV
          echo "COMMIT_HASH=$(git rev-parse --short origin/main)" >> $GITHUB_ENV

      - name: Push source branch to target branch
        if: ${{ success() }}
        run: |
          git switch -C ${{ matrix.target_branch }}
          git merge --ff-only ${{ env.COMMIT_HASH }}
          git push origin ${{ matrix.target_branch }}

