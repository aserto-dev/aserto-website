[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"

[context.production]
  publish = "out"
  command = "yarn build"
  [context.production.environment]
    NEXT_PUBLIC_ASERTO_CONSOLE_ROOT_URL = "https://console.aserto.com"
    NEXT_PUBLIC_ASERTO_PLAYGROUND_ROOT_URL = "https://aserto-playground.netlify.com"
    NEXT_PUBLIC_ASERTO_SIGNUP_RECAPTCHA_SITEKEY = "6LeZ0T0dAAAAAFWzx5r5ePMrPrFjirQ47tUTi9x0"
    NEXT_PUBLIC_ASERTO_FUNNEL_SERVICE_URL = "https://funnel.prod.aserto.com"
    NEXT_PUBLIC_ASERTO_WEBSITE_URL = "https://aserto.com"
    NEXT_PUBLIC_HUBSPOT_URL = 'https://api.hsforms.com/submissions/v3/integration/submit/21300286/8ab7a6d3-c090-45db-8a0c-780d4ea53581'
    NEXT_PUBLIC_GTM_CODE = 'GTM-5QFZQHB'

