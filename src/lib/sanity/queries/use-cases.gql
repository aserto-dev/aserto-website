query UseCasesPages {
  allUseCasePage(sort: { _updatedAt: DESC }) {
    ...UseCase
  }
}

query UseCasesPagePaths {
  allUseCasePage {
    slug {
      current
    }
  }
}

query UseCasesPage($slug: String!) {
  allUseCasePage(where: { slug: { current: { eq: $slug } } }, limit: 1) {
    ...UseCase
  }
}