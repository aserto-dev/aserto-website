fragment HomePage on Home {
  metadata {
    title
    description
  }
  tagline
  positioningStatementRaw
  valueProps {
    ...ValueProp
  }
  theProblemSectionTitle
  theProblemSectionCards {
    ...SectionBlock
  }
  testimonialsSectionTitle
  callToAction {
    caption
    signup
    contact
    contactEngineer
  }
}

query HomePage {
  allHome(sort: { _createdAt: DESC }, limit: 1) {
    ...HomePage
  }
  allCaseStudy(sort: { _createdAt: DESC }) {
    ...CaseStudyMeta
  }
}
