fragment HomePage on Home {
  metadata {
    title
    description
  }
  title
  subtitle
  slogan {
    text
  }
  ctaLabel
  theProblemSectionLabel
  theProblemSectionTitle
  theProblemSectionSubtitle
  theProblemSectionCards {
    ...SectionBlock
  }
  theSolutionSectionLabel
  theSolutionSectionTitle
  theSolutionSectionCards {
    ...SectionBlock
  }
  featuresSectionTitle
  features {
    titleRaw
    blocks {
      ...FeatureItem
    }
  }
  customerSpotlightSectionTitle
  customerSpotlightSectionEnabled
  testimonialsSectionTitle
  testimonials {
    authorAvatar {
      ...Image
    }
    authorName
    authorPosition
    quoteRaw
  }
  pillars {
    title
    image {
      ...Image
    }
    imagePath
    description
  }
  infos {
    image {
      ...Image
    }
    imagePath
    title
    subtitle
    items {
      image {
        ...Image
      }
      title
    }
  }
}

query HomePage {
  allHome(sort: { _createdAt: DESC }, limit: 1) {
    ...HomePage
  }
  allCaseStudy(sort: { _createdAt: DESC }) {
    ...CaseStudyMeta
  }
}
