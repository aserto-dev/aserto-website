fragment HomePage on Home {
  metadata {
    title
    description
  }
  tagline
  positioningStatementRaw
  subtaglineRaw
  heroImage {
    ...Image
  }
  animatedGifs {
    ...Image
  }
  demoUrl
  valueProps {
    ...ValueProp
  }
  theProblemSectionTitle
  theProblemSectionCards {
    ...SectionBlock
  }
  testimonialsSectionTitle
  callToAction {
    caption
    signup
    contact
    contactEngineer
    contactEngineerDark
  }
}

query HomePage {
  allHome(sort: { _createdAt: DESC }, limit: 1) {
    ...HomePage
  }
  allCaseStudy(sort: { _createdAt: DESC }) {
    ...CaseStudyMeta
  }
  allEvent(
    sort: { _createdAt: DESC }
    where: { feature: { eq: true } }
    limit: 1
  ) {
    ...Event
  }
}
