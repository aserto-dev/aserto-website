query ResourcesPages {
  allResourcePage(sort: { index: ASC }) {
    ...Resource
  }
}

query ResourcesPagePaths {
  allResourcePage {
    slug {
      current
    }
  }
}

query ResourcesPage($slug: String!) {
  allResourcePage(where: { slug: { current: { eq: $slug } } }, limit: 1) {
    ...Resource
  }
}
