fragment FaqItem on FaqBlock {
  title
  questions {
    question
    answerRaw
  }
}

query FaqPage($slug: String!) {
  allFaq(where: { slug: { current: { eq: $slug } } }, limit: 1) {
    metadata {
      title
      description
    }
    title
    subtitle
    slug {
      current
    }
    faqs {
      ...FaqItem
    }
  }
}

query FaqPagePaths {
  allFaq(sort: { _createdAt: DESC }) {
    slug {
      current
    }
  }
}
