query BlogIndex($now: DateTime) {
  allPost(sort: { publishedAt: DESC } where: {_: { is_draft: false}, publishedAt: {lt: $now}}) {
    ...PostMeta
  }
}

query BlogPostPaths {
  allPost {
    slug {
      current
    }
  }
}

query BlogPost($slug: String!) {
  allPost(where: { slug: { current: { eq: $slug } } }, limit: 1) {
    ...Post
  }
}
