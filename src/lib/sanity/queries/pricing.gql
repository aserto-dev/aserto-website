fragment Pricing on Pricing {
  metadata {
    title
    description
  }
  title
  subtitle
  editionNameToHighlight
  pricingTable {
    title
    features {
      rows {
        cells
      }
    }
  }
}

query Pricing {
  allPricing(sort: { _createdAt: DESC }, limit: 1) {
    ...Pricing
  }
  allEdition(sort: { index: ASC }) {
    ...Edition
  }
}
