fragment Image on MainImage {
  crop {
    _key
    _type
    top
    bottom
    left
    right
  }
  hotspot {
    _key
    _type
    x
    y
    height
    width
  }
  asset {
    _id
    url
    title
    assetId
    path
    metadata {
      dimensions {
        width
        height
      }
    }
  }
  captionRaw
  alt
}
