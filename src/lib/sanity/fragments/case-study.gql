fragment CaseStudyMeta on CaseStudy {
  _id
  _createdAt
  metadata {
    title
    description
  }
  company
  logo {
    ...Image
  }
  titleRaw
  slug {
    current
  }
}

fragment CaseStudy on CaseStudy {
  ...CaseStudyMeta
  overviewRaw
  challengeRaw
  solutionRaw
  resultsRaw
  impact {
    icon {
      ...Image
    }
    title
  }
  quote {
    authorAvatar {
      ...Image
    }
    authorName
    authorPosition
    quoteRaw
  }
}
